<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SNCTVM — DUAL TIME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAFAF9;
  --bg2:#F5F5F4;
  --black:#000000;
  --white:#FAFAF9;
  --yellow:#E8FF00;
  --pink:#FF3366;
  --blue:#00D9FF;
  --gray:#737373;
  --gray-l:#D4D4D4;
  --serif:'EB Garamond',Georgia,serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}

html,body{
  height:100%;width:100%;
  background:var(--bg);
  color:var(--black);
  font-family:var(--mono);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

.shell{
  height:100vh;
  display:grid;
  grid-template-rows:52px 1fr 38px;
  max-width:840px;
  margin:0 auto;
  padding:0 24px;
}

/* ── HEADER ── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:3px solid var(--black);
}
.logo{display:flex;align-items:center;gap:0}
.logo-brkt{font-size:18px;font-weight:700;color:var(--black);letter-spacing:0}
.logo-name{font-family:var(--serif);font-size:22px;letter-spacing:-.02em;color:var(--black)}
.logo-sep{width:1px;height:18px;background:var(--gray-l);margin:0 14px}
.logo-sub{font-size:9px;letter-spacing:.22em;color:var(--gray);text-transform:uppercase}

.hdr-right{display:flex;align-items:center;gap:14px}
.utc-block{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.utc-label{font-size:8px;letter-spacing:.2em;color:var(--gray);text-transform:uppercase}
.utc-val{font-size:12px;letter-spacing:.1em;color:var(--black)}

/* Botón secundario per guía — fondo blanco, borde negro 2px */
.btn-fs{
  background:var(--white);
  border:2px solid var(--black);
  color:var(--black);
  padding:5px 14px;
  font-family:var(--mono);font-size:9px;
  letter-spacing:.18em;text-transform:uppercase;
  cursor:pointer;
  transition:background .15s;
  box-shadow:3px 3px 0 var(--black);
}
.btn-fs:hover{background:var(--yellow)}
.btn-fs:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--black)}

/* ── BODY ── */
.body{
  display:grid;
  grid-template-rows:1fr auto 1fr;
  padding:16px 0 12px;
  overflow:hidden;
}

/* ── TIME BLOCK ── */
.tblock{
  display:flex;flex-direction:column;justify-content:center;
  padding:0 2px;
}

.tb-eyebrow{
  display:flex;align-items:center;gap:10px;
  margin-bottom:6px;
}
/* Yellow bar accent — 4px exacto según guía */
.tb-bar{width:4px;height:20px;flex-shrink:0;background:var(--yellow)}
.ru .tb-bar{background:var(--pink)}

.tb-label{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--gray)}

.tb-tz{
  margin-left:auto;
  font-size:9px;letter-spacing:.14em;
  padding:3px 9px;
  border:2px solid var(--black);
  background:var(--bg2);
  color:var(--black);
}

/* Clock — EB Garamond, display grande */
.tb-clock{
  font-family:var(--serif);
  font-weight:400;
  line-height:.88;
  letter-spacing:-.03em;
  color:var(--black);
  font-size:clamp(80px,15vw,130px);
  margin-bottom:10px;
}

/* Accent underline bajo el reloj */
.tb-clock-wrap{position:relative;display:inline-block}
.tb-clock-wrap::after{
  content:'';
  display:block;
  height:3px;width:56px;
  background:var(--yellow);
  margin-top:6px;
}
.ru .tb-clock-wrap::after{background:var(--pink)}

.tb-meta{display:flex;align-items:center;gap:16px;margin-top:4px}
.tb-date{font-size:10px;letter-spacing:.15em;color:var(--gray);text-transform:uppercase}
.tb-diff{margin-left:auto;font-size:9px;letter-spacing:.1em;color:var(--gray)}

/* ── CENTER ZONE ── */
.center-zone{
  padding:8px 0;
  display:flex;flex-direction:column;
  gap:0;
}
.sep{width:100%;height:3px;background:var(--black);flex-shrink:0}

/* STATS STRIP — cards con borde negro 2px y sombra offset */
.stats-row{
  display:flex;align-items:stretch;
  border-left:3px solid var(--black);
  border-right:3px solid var(--black);
  border-bottom:3px solid var(--black);
  flex-shrink:0;
}
.stat-item{
  flex:1;padding:7px 12px;
  border-right:2px solid var(--black);
  background:var(--white);
  display:flex;flex-direction:column;gap:2px;
}
.stat-item:last-child{border-right:none}
.stat-label{font-size:7px;letter-spacing:.22em;color:var(--gray);text-transform:uppercase}
.stat-val{font-size:15px;font-weight:700;letter-spacing:.02em;color:var(--black)}
/* Yellow highlight solo en el primero */
.stat-item:first-child .stat-val{color:var(--black)}
.stat-item:first-child{background:var(--yellow)}

/* N8N GRAPH */
.graph-area{
  flex:1;display:flex;align-items:center;
  padding:8px 0 4px;
  overflow:hidden;
}
.graph-svg{width:100%;overflow:visible}

/* Node styles — light theme */
.node-card{fill:var(--white);stroke:var(--black);stroke-width:2}
.node-card-active{fill:var(--yellow);stroke:var(--black);stroke-width:2}
.node-card-ru{fill:var(--white);stroke:var(--black);stroke-width:2}

.nt{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;fill:#000;text-transform:uppercase}
.ns{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.08em;fill:#737373}

/* Connector dots */
.dot-y{fill:var(--yellow);stroke:var(--black);stroke-width:1.5}
.dot-p{fill:var(--pink);stroke:var(--black);stroke-width:1.5}
.dot-n{fill:var(--gray-l);stroke:var(--black);stroke-width:1.5}

/* Lines */
.line-base{fill:none;stroke:#D4D4D4;stroke-width:1.5}
.line-active{fill:none;stroke:var(--black);stroke-width:1.5}

/* Pulse dashes */
.pulse-y{fill:none;stroke:var(--black);stroke-width:1.5;stroke-dasharray:5 12}
.pulse-p{fill:none;stroke:var(--pink);stroke-width:1.5;stroke-dasharray:5 12}

/* ── TICKER ── */
.ticker{
  border-top:3px solid var(--black);
  background:var(--black);
  display:flex;align-items:center;overflow:hidden;
}
.t-lbl{
  background:var(--yellow);color:var(--black);
  font-size:9px;font-weight:700;letter-spacing:.22em;
  padding:0 14px;height:100%;
  display:flex;align-items:center;
  border-right:3px solid var(--black);flex-shrink:0;
}
.t-track{overflow:hidden;flex:1;display:flex;align-items:center;height:100%}
.t-inner{
  display:flex;white-space:nowrap;
  animation:tick 44s linear infinite;
  font-size:9px;font-weight:700;letter-spacing:.15em;color:var(--gray-l);
}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.t-sep{margin:0 14px;color:#333}
</style>
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <header class="hdr">
    <div class="logo">
      <span class="logo-brkt">[</span>
      <span class="logo-name">SNCTVM</span>
      <span class="logo-brkt">]</span>
      <div class="logo-sep"></div>
      <span class="logo-sub">System Dashboard</span>
    </div>
    <div class="hdr-right">
      <div class="utc-block">
        <span class="utc-label">UTC</span>
        <span class="utc-val" id="utc-clk">--:--:--</span>
      </div>
      <button class="btn-fs" id="fs-btn" onclick="toggleFS()">⛶ FULL</button>
    </div>
  </header>

  <!-- BODY -->
  <div class="body">

    <!-- MX -->
    <div class="tblock mx">
      <div class="tb-eyebrow">
        <div class="tb-bar"></div>
        <span class="tb-label">Ciudad de México</span>
        <span class="tb-tz">CDT · UTC−6</span>
      </div>
      <div class="tb-clock-wrap">
        <div class="tb-clock" id="mx-clk">--:--:--</div>
      </div>
      <div class="tb-meta">
        <span class="tb-date" id="mx-date">---</span>
        <span class="tb-diff">→ MSK +9H</span>
      </div>
    </div>

    <!-- CENTER -->
    <div class="center-zone">
      <div class="sep"></div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-label">USUARIOS</div>
          <div class="stat-val" id="s-users">89</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">TXN / HR</div>
          <div class="stat-val" id="s-txn">1,247</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">LATENCIA</div>
          <div class="stat-val" id="s-lat">14ms</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">UPTIME</div>
          <div class="stat-val">99.7%</div>
        </div>
      </div>

      <!-- Graph -->
      <div class="graph-area">
        <svg class="graph-svg" viewBox="0 0 780 82" preserveAspectRatio="xMidYMid meet">
          <defs>
            <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M2 2L8 5L2 8" fill="none" stroke="#D4D4D4" stroke-width="1.5" stroke-linecap="round"/>
            </marker>
            <marker id="ah-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M2 2L8 5L2 8" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
            </marker>
            <marker id="ah-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M2 2L8 5L2 8" fill="none" stroke="#FF3366" stroke-width="1.5" stroke-linecap="round"/>
            </marker>
          </defs>

          <!-- LINES -->
          <path class="line-base" d="M140,41 C162,41 170,41 192,41" marker-end="url(#ah)"/>
          <path class="line-active" d="M298,41 C320,41 328,41 350,41" marker-end="url(#ah-b)"/>
          <path class="line-active" d="M458,41 C480,41 488,41 510,41" marker-end="url(#ah-b)"/>
          <path class="line-base" d="M614,41 C636,41 644,41 666,41" marker-end="url(#ah)"/>

          <!-- PULSES -->
          <path class="pulse-y" d="M298,41 C320,41 328,41 350,41">
            <animate attributeName="stroke-dashoffset" from="17" to="-17" dur="1.2s" repeatCount="indefinite"/>
          </path>
          <path class="pulse-y" d="M458,41 C480,41 488,41 510,41">
            <animate attributeName="stroke-dashoffset" from="17" to="-17" dur="1.2s" begin=".6s" repeatCount="indefinite"/>
          </path>
          <path class="pulse-p" d="M140,41 C162,41 170,41 192,41">
            <animate attributeName="stroke-dashoffset" from="17" to="-17" dur="2s" repeatCount="indefinite"/>
          </path>
          <path class="pulse-p" d="M614,41 C636,41 644,41 666,41">
            <animate attributeName="stroke-dashoffset" from="17" to="-17" dur="2s" begin="1s" repeatCount="indefinite"/>
          </path>

          <!-- NODE: MX -->
          <g transform="translate(12,14)">
            <rect class="node-card" width="128" height="54" rx="4"/>
            <!-- yellow bar -->
            <rect x="0" y="0" width="4" height="54" fill="#E8FF00"/>
            <!-- hard shadow -->
            <rect x="3" y="3" width="128" height="54" rx="4" fill="#000" style="z-index:-1"/>
            <rect class="node-card" width="128" height="54" rx="4"/>
            <rect x="0" y="0" width="4" height="54" fill="#E8FF00"/>
            <text x="16" y="24" class="nt">MX NODE</text>
            <text x="16" y="37" class="ns">Ciudad de México</text>
            <text x="16" y="49" class="ns">CDT · UTC−6</text>
            <circle cx="128" cy="27" r="5" class="dot-y"/>
          </g>

          <!-- NODE: AUTH -->
          <g transform="translate(192,17)">
            <rect x="3" y="3" width="106" height="48" rx="4" fill="#000"/>
            <rect class="node-card" width="106" height="48" rx="4"/>
            <circle cx="0" cy="24" r="5" class="dot-n"/>
            <text x="14" y="22" class="nt">AUTH</text>
            <text x="14" y="35" class="ns">TLS 1.3 · verified</text>
            <circle cx="106" cy="24" r="5" class="dot-y"/>
          </g>

          <!-- NODE: SYNC — active, yellow fill -->
          <g transform="translate(350,10)">
            <rect x="3" y="3" width="108" height="62" rx="4" fill="#000"/>
            <rect class="node-card-active" width="108" height="62" rx="4"/>
            <circle cx="0" cy="31" r="5" class="dot-y"/>
            <text x="12" y="24" class="nt">MX · RU</text>
            <text x="12" y="37" class="ns" style="fill:#000">SYNC BRIDGE</text>
            <text x="12" y="50" class="ns" id="g-status" style="fill:#000">● ONLINE</text>
            <circle cx="108" cy="31" r="5" class="dot-y"/>
            <!-- pulse ring -->
            <circle cx="108" cy="31" r="9" fill="none" stroke="#000" stroke-width="1" opacity=".3">
              <animate attributeName="r" values="8;14;8" dur="2s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values=".4;0;.4" dur="2s" repeatCount="indefinite"/>
            </circle>
          </g>

          <!-- NODE: ESCROW -->
          <g transform="translate(510,17)">
            <rect x="3" y="3" width="104" height="48" rx="4" fill="#000"/>
            <rect class="node-card" width="104" height="48" rx="4"/>
            <circle cx="0" cy="24" r="5" class="dot-y"/>
            <text x="14" y="22" class="nt">ESCROW</text>
            <text x="14" y="35" class="ns">Verificado</text>
            <circle cx="104" cy="24" r="5" class="dot-n"/>
          </g>

          <!-- NODE: RU -->
          <g transform="translate(666,14)">
            <rect x="3" y="3" width="102" height="54" rx="4" fill="#000"/>
            <rect class="node-card-ru" width="102" height="54" rx="4"/>
            <rect x="0" y="0" width="4" height="54" fill="#FF3366"/>
            <circle cx="0" cy="27" r="5" class="dot-p"/>
            <text x="16" y="24" class="nt">RU NODE</text>
            <text x="16" y="37" class="ns">Москва</text>
            <text x="16" y="49" class="ns">MSK · UTC+3</text>
          </g>

        </svg>
      </div>

      <div class="sep"></div>
    </div>

    <!-- RU -->
    <div class="tblock ru">
      <div class="tb-eyebrow">
        <div class="tb-bar"></div>
        <span class="tb-label">Москва</span>
        <span class="tb-tz">MSK · UTC+3</span>
      </div>
      <div class="tb-clock-wrap">
        <div class="tb-clock" id="ru-clk">--:--:--</div>
      </div>
      <div class="tb-meta">
        <span class="tb-date" id="ru-date">---</span>
        <span class="tb-diff">→ CDT −9H</span>
      </div>
    </div>

  </div>

  <!-- TICKER -->
  <div class="ticker">
    <div class="t-lbl">▶ SNCTVM</div>
    <div class="t-track">
      <div class="t-inner" id="tkr"></div>
    </div>
  </div>

</div>

<script>
const pad=n=>String(n).padStart(2,'0');
const rnd=(a,b)=>Math.floor(Math.random()*(b-a)+a);
const DAYS=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const MONTHS=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

// WAKE LOCK
let wl=null;
async function acqWL(){
  if('wakeLock' in navigator){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!wl)acqWL()});
acqWL();

// FULLSCREEN
function toggleFS(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}
document.addEventListener('fullscreenchange',()=>{
  document.getElementById('fs-btn').textContent=document.fullscreenElement?'⛶ EXIT':'⛶ FULL';
});

// CLOCKS
function getZone(tz){
  const now=new Date();
  const fmt=new Intl.DateTimeFormat('en-US',{
    timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
  });
  const parts=fmt.formatToParts(now);
  const g=t=>parts.find(p=>p.type===t)?.value;
  const h=parseInt(g('hour'))%24,m=parseInt(g('minute')),s=parseInt(g('second'));
  const y=parseInt(g('year')),mo=parseInt(g('month'))-1,d=parseInt(g('day'));
  return{h,m,s,dow:new Date(y,mo,d).getDay(),d,mo,y};
}
function updateClocks(){
  const now=new Date();
  document.getElementById('utc-clk').textContent=`${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())}`;
  const mx=getZone('America/Mexico_City');
  const ru=getZone('Europe/Moscow');
  document.getElementById('mx-clk').textContent=`${pad(mx.h)}:${pad(mx.m)}:${pad(mx.s)}`;
  document.getElementById('mx-date').textContent=`${DAYS[mx.dow]} ${pad(mx.d)} ${MONTHS[mx.mo]} ${mx.y}`;
  document.getElementById('ru-clk').textContent=`${pad(ru.h)}:${pad(ru.m)}:${pad(ru.s)}`;
  document.getElementById('ru-date').textContent=`${DAYS[ru.dow]} ${pad(ru.d)} ${MONTHS[ru.mo]} ${ru.y}`;
}
updateClocks();setInterval(updateClocks,1000);

// METRICS
let txn=1247,users=89;
function updateMetrics(){
  txn=Math.max(800,txn+rnd(-3,9));
  users=Math.max(40,Math.min(200,users+rnd(-1,3)));
  document.getElementById('s-users').textContent=users;
  document.getElementById('s-txn').textContent=txn.toLocaleString();
  document.getElementById('s-lat').textContent=rnd(8,48)+'ms';
}
setInterval(updateMetrics,2000);

// GRAPH blink
const gs=document.getElementById('g-status');
setInterval(()=>{gs.textContent=gs.textContent.startsWith('●')?'○ ONLINE':'● ONLINE'},900);

// TICKER
const items=['SNCTVM ONLINE','→ MARKETPLACE EXCLUSIVO','MEMBERS ONLY','MX · RU SYNC ACTIVO','TRANSACCIONES VERIFICADAS','→ ZERO DOWNTIME','SISTEMA SEGURO','ELITE NETWORK','→ TLS 1.3 ENCRYPTED','ACCESO CONTROLADO'];
const all=[...items,...items];
document.getElementById('tkr').innerHTML=all.map(t=>`<span>${t}</span><span class="t-sep"> // </span>`).join('');
</script>
</body>
</html>
